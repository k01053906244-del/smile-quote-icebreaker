<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>어색A 서먹I</title>
    <!-- PWA Metadata -->
    <link rel="manifest" href="manifest-v2.json">
    <meta name="theme-color" content="#6366f1">
    <link rel="apple-touch-icon" href="icon.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Outfit:wght@300;600;800&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --bg: #0f172a;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top left, #1e1b4b, #0f172a);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #smileGateway {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.98);
            backdrop-filter: blur(15px);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease;
        }

        #webcam {
            width: 90%;
            max-width: 380px;
            aspect-ratio: 4/3;
            object-fit: cover;
            border-radius: 20px;
            border: 3px solid var(--primary);
            display: none;
            margin-bottom: 20px;
            transform: scaleX(-1);
        }

        .container {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            border: 1px solid var(--glass-border);
            text-align: center;
        }

        .container::-webkit-scrollbar {
            display: none;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 2.2rem;
            margin-bottom: 25px;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn {
            margin-top: 20px;
            padding: 16px 32px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        #setup,
        #punchline {
            display: block;
            width: 100%;
            white-space: pre-wrap;
            word-break: keep-all;
            line-height: 1.6;
        }

        #setup {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: #e2e8f0;
        }

        #punchline {
            font-size: 1.1rem;
            color: #94a3b8;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        #punchline.show {
            opacity: 1;
        }

        .situation-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 45vh;
            overflow-y: auto;
            padding: 10px;
        }

        .btn-situation {
            display: block;
            width: 100%;
            height: auto;
            min-height: fit-content;
            background: rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
            border: 1px solid var(--glass-border);
            padding: 15px;
            border-radius: 12px;
            text-align: left;
            cursor: pointer;
            white-space: pre-wrap;
            word-break: keep-all;
            line-height: 1.5;
        }

        .btn-relock {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            color: #cbd5e1;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            cursor: pointer;
            z-index: 100;
        }

        .daily-game-container {
            margin-bottom: 30px;
            text-align: center;
            perspective: 1000px;
        }

        .daily-game-title {
            font-size: 1.1rem;
            color: #818cf8;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .tap-hint {
            font-size: 0.75rem;
            color: #64748b;
            margin-bottom: 15px;
            animation: blink 1s infinite;
        }

        .balance-card-visual {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 70px;
            border-radius: 18px;
            overflow: hidden;
            background: #9a3392;
            border: 2px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            user-select: none;
        }

        .balance-card-visual:active {
            transform: scale(0.95) rotate(-2deg);
        }

        .bc-option {
            flex: 1;
            padding: 15px;
            font-size: 0.9rem;
            font-weight: 700;
            color: #fff;
            word-break: keep-all;
            line-height: 1.3;
        }

        .bc-left {
            background: linear-gradient(90deg, rgba(99, 102, 241, 0.4), transparent);
        }

        .bc-right {
            background: linear-gradient(270deg, rgba(168, 85, 247, 0.4), transparent);
        }

        .bc-vs {
            position: absolute;
            width: 36px;
            height: 36px;
            background: #0f172a;
            border: 2px solid var(--secondary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 900;
            color: var(--secondary);
            z-index: 2;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
        }

        .fade-in {
            animation: cardIn 0.5s ease;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(20px) rotate(3deg);
            }

            to {
                opacity: 1;
                transform: translateY(0) rotate(0);
            }
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 0.3;
            }

            50% {
                opacity: 1;
            }
        }

        .loading-text {
            animation: pulse 1.5s infinite;
            color: #c084fc;
            font-weight: bold;
            margin-top: 10px;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

        // ★ [Web Audio API] 브라우저 자체 칩셋을 이용한 레트로 게임 팡파르 합성기 (절대 실패 없음)
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // 기존 대기열 초기화 (필수)
                if (!text) return;
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ko-KR';
                utterance.rate = 1.0;
                utterance.pitch = 1.1; 
                window.speechSynthesis.speak(utterance);
            }
        }

        function initAudioEngine() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                // 무음 오실레이터로 오디오 컨텍스트 완전히 활성화
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                gain.gain.value = 0;
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(0);
                osc.stop(0.1);
                
                speak(""); // TTS 엔진 초기 활성화
            } catch (e) {
                console.error("Audio Init Fail:", e);
            }
        }

        function playDrumSound() {
            if (!audioCtx) initAudioEngine();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            // 더 선명한 드럼 소리로 조정
            osc.frequency.setValueAtTime(180, now);
            osc.frequency.exponentialRampToValueAtTime(40, now + 0.2);
            gain.gain.setValueAtTime(0.8, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        }

        function playCricketsSound() {
            if (!audioCtx) initAudioEngine();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            for (let i = 0; i < 3; i++) {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const startTime = now + (i * 0.3);
                osc.frequency.setValueAtTime(3500, startTime);
                osc.frequency.setValueAtTime(4000, startTime + 0.04);
                gain.gain.setValueAtTime(0, startTime);
                gain.gain.linearRampToValueAtTime(0.1, startTime + 0.02);
                gain.gain.linearRampToValueAtTime(0, startTime + 0.08);
                osc.start(startTime);
                osc.stop(startTime + 0.08);
            }
        }

        function playRetroFanfare() {
            if (!audioCtx) initAudioEngine();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const melody = [
                { f: 261.63, d: 0.15 }, { f: 329.63, d: 0.15 }, { f: 392.00, d: 0.15 },
                { f: 523.25, d: 0.15 }, { f: 659.25, d: 0.15 }, { f: 783.99, d: 0.15 },
                { f: 1046.50, d: 0.6 }
            ];
            let cumulativeTime = 0;
            melody.forEach((note, i) => {
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc.type = (i === melody.length - 1) ? 'sine' : 'square';
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                const startTime = now + cumulativeTime;
                osc.frequency.setValueAtTime(note.f, startTime);
                gainNode.gain.setValueAtTime(0, startTime);
                gainNode.gain.linearRampToValueAtTime(0.2, startTime + 0.02);
                gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + note.d);
                osc.start(startTime);
                osc.stop(startTime + note.d);
                cumulativeTime += note.d * 0.7;
            });
        }

                b.onclick = () => {
                    if (window.currentCategory === '어색') playCricketsSound();
                    document.getElementById('listView').style.display = 'none'; document.getElementById('resultView').style.display = 'flex';
                    document.getElementById('setup').innerHTML = `<span style="color:${window.currentCategory === '어색' ? '#c084fc' : '#38bdf8'}">[${item.situation}]</span><br>💡 ${item.guide}`;
                    document.getElementById('punchline').innerText = `"${item.joke}"`; document.getElementById('punchline').classList.remove('show');
                    setTimeout(() => document.getElementById('punchline').classList.add('show'), 300);
                };
                list.appendChild(b);
            });
            document.getElementById('mainView').style.display = 'none'; document.getElementById('listView').style.display = 'block';
        };
        window.goHome = () => { document.getElementById('mainView').style.display = 'block'; document.getElementById('listView').style.display = 'none'; document.getElementById('resultView').style.display = 'none'; };

        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(reg => console.log('SW Registered')).catch(err => console.log('SW Error', err));
            });
        }
    </script>
</body>

</html>
