            --bg: #0f172a;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top left, #1e1b4b, #0f172a);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #smileGateway {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.98);
            backdrop-filter: blur(15px);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            object-fit: cover;
            border-radius: 20px;
            border: 3px solid var(--primary);
            display: none;
            margin-bottom: 20px;
            transform: scaleX(-1);
        }

        .container {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 600px;
            max-height: 85vh;

            font-size: 2.2rem;
            margin-bottom: 20px;

            padding: 16px 32px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            font-weight: 700;
            cursor: pointer;

            width: 100%;
            white-space: pre-wrap;
            word-break: keep-all;
            line-height: 1.6;

            text-align: left;

            right: 15px;

</head>

            { category: "서먹", situation: "어색한 미용실", guide: "디자이너의 실력을 칭찬하세요.", joke: "선생님 손길이 정말 섬세하시네요. 믿음이 팍팍 갑니다!" },
            { category: "서먹", situation: "조용한 택시 안", guide: "기사님께 가벼운 안부를 물으세요.", joke: "오늘도 고생 많으십니다. 이 시간엔 길이 좀 덜 막히네요." },
            { category: "서먹", situation: "안 친한 지인 결혼식", guide: "신랑 신부가 행복해 보인다고 하세요.", joke: "신랑/신부가 너무 행복해 보이네요. 보기 좋죠?" },
            { category: "서먹", situation: "나 홀로 회식 자리", guide: "안주 맛을 칭찬하며 말을 거세요.", joke: "여기 안주 정말 맛있네요. 다들 이거 드셔보셨나요?" },
            { category: "서먹", situation: "룸메이트와 단둘이", guide: "저녁 메뉴를 같이 정하자고 하세요.", joke: "우리 오늘 저녁은 뭐 먹을까요? 메뉴 고민 좀 해볼까요?" },
            { category: "서먹", situation: "스터디 첫날", guide: "함께 목표 달성하자고 파이팅하세요.", joke: "우리 다 같이 열공해서 목표 달성해봐요! 화이팅!" },
            { category: "서먹", situation: "학부모 첫 모임", guide: "아이들이 같은 반이라 반갑다고 하세요.", joke: "아이들이 같은 반이라니 반가워요. 많이 가르쳐주세요!" },
            { category: "서먹", situation: "옆자리 동료", guide: "간식을 나누며 업무 협조를 구하세요.", joke: "이거 드시면서 하세요. 오늘 업무가 좀 많죠?" },
            { category: "서먹", situation: "퇴사 인사", guide: "그동안 감사했다고 인사하세요.", joke: "그동안 많이 배웠습니다. 덕분에 즐겁게 일했어요!" },
            { category: "서먹", situation: "신입사원과 단둘이", guide: "신입 때의 어색함을 공유해 주세요.", joke: "처음엔 다 어색하죠? 저도 신입 때 그랬어요. 다 물어봐요!" },
            { category: "서먹", situation: "100일째 존댓말", guide: "말을 놓자고 친근하게 제안하세요.", joke: "우리 이제 슬슬 말을 놓아볼까요? 더 친해지고 싶어서요!" },
            { category: "서먹", situation: "동네 단골 식당", guide: "사장님의 손맛을 극찬해 보세요.", joke: "오늘도 변함없이 맛있네요. 사장님 손맛은 역시 최고예요!" },
            { category: "서먹", situation: "타 회사 직원", guide: "자주 뵙는다며 가벼운 인사를 하세요.", joke: "안녕하세요. 매일 뵙는 것 같은데 인사는 처음 드리네요!" },
            { category: "서먹", situation: "친구 지인 술자리", guide: "칭찬을 통해 호감을 표시하세요.", joke: "얘기 많이 들었어요! 실제로 뵈니 더 매력적이시네요." },
            { category: "서먹", situation: "명절 사촌 동생", guide: "언제 이렇게 컸냐며 대견해 하세요.", joke: "와, 너 언제 이렇게 컸어? 이제 완전 어른 다 됐네!" }
        ];

        const dailyGames = ["평생 양치 안 하기 vs 평생 샤워 안 하기", "비트코인 1개 받기 vs 로또 1등 번호 알기", "100% 확률로 1억 vs 10% 확률로 100억"];

        /* 핵심 로직 변수 */
        const gateway = document.getElementById('smileGateway'), video = document.getElementById('webcam'), startBtn = document.getElementById('startCamBtn'), status = document.getElementById('gatewayStatus');
        let faceLandmarker, stream, isUnlocked = false, animReqId, audioUnlocked = false;

        // ★ [오디오 팩토리] 절대 실패하지 않는 오디오 세팅[cite: 1]
        const successAudio = new Audio('https://assets.mixkit.co/active_storage/sfx/2013/success-fanfare-trumpet-notification-240.wav');
        successAudio.preload = 'auto';

        async function initAI() {
            try {
                const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
                faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
                    baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task", delegate: "GPU" },
                    outputFaceBlendshapes: true, runningMode: "VIDEO"
                });
                status.style.display = 'none'; document.getElementById('gatewayLoader').style.display = 'none';
                startBtn.style.display = 'block';
            } catch (e) { status.innerText = "네트워크를 확인해 주세요."; }
        }
        initAI();

        startBtn.onclick = async () => {
            // ★ [강제 오디오 언락] 버튼 클릭 시 0.1초 무음 재생으로 브라우저 권한 탈취
            if (!audioUnlocked) {
                successAudio.play().then(() => { successAudio.pause(); successAudio.currentTime = 0; audioUnlocked = true; }).catch(e => console.log("Audio unlock fail"));
            }
            startBtn.style.display = 'none'; status.innerText = "카메라 준비 중..."; status.style.display = 'block';
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                video.srcObject = stream; video.style.display = 'block'; status.style.display = 'none';
                await video.play(); predictWebcam();
            } catch (e) { window.forceUnlock(); }
        };

        async function predictWebcam() {
            if (isUnlocked || video.paused) return;
            const faceResults = faceLandmarker.detectForVideo(video, performance.now());
            if (faceResults.faceBlendshapes?.length > 0) {
                const shapes = faceResults.faceBlendshapes[0].categories;
                const smile = (shapes.find(s => s.categoryName === "mouthSmileLeft")?.score + shapes.find(s => s.categoryName === "mouthSmileRight")?.score) / 2;
                if (smile > 0.20) {
                    confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                    // ★ [오디오 재생] 권한이 확보된 상태에서 즉시 재생
                    successAudio.play().catch(e => console.log("Audio blocked", e));
                    setTimeout(window.forceUnlock, 800);
                    return;
                }
            }
            animReqId = requestAnimationFrame(predictWebcam);
        }

        window.forceUnlock = () => {
            if (isUnlocked) return; isUnlocked = true;
            if (animReqId) cancelAnimationFrame(animReqId);
            if (stream) stream.getTracks().forEach(t => t.stop());
            gateway.style.display = 'none';
        };

        window.relockApp = () => {
            isUnlocked = false; gateway.style.display = 'flex';
            video.style.display = 'none'; startBtn.style.display = 'block';
            window.goHome();
        };

        /* 뷰 컨트롤러 */
        const mainView = document.getElementById('mainView'), listView = document.getElementById('listView'), resultView = document.getElementById('resultView'), situationList = document.getElementById('situationList'), setupEl = document.getElementById('setup'), punchlineEl = document.getElementById('punchline');
        window.currentCategory = ''; let filteredData = [];

        window.showListView = (cat) => {
            window.currentCategory = cat; filteredData = humorData.filter(d => d.category === cat);
            situationList.innerHTML = '';
            filteredData.forEach((item, idx) => {
                const b = document.createElement('button'); b.className = 'btn-situation'; b.innerText = `• ${item.situation}`;
                b.onclick = () => showResult(idx); situationList.appendChild(b);
            });
            mainView.style.display = 'none'; listView.style.display = 'block'; resultView.style.display = 'none';
        };

        function showResult(idx) {
            const item = filteredData[idx];
            listView.style.display = 'none'; resultView.style.display = 'flex';
            setupEl.innerHTML = `<span style="color:${window.currentCategory === '어색' ? '#c084fc' : '#38bdf8'}">[${item.situation}]</span><br>💡 ${item.guide}`;
            punchlineEl.innerText = `"${item.joke}"`; punchlineEl.classList.remove('show');
            setTimeout(() => punchlineEl.classList.add('show'), 300);
        }

        window.goHome = () => { mainView.style.display = 'block'; listView.style.display = 'none'; resultView.style.display = 'none'; };

        function renderBalance() {
            const container = document.getElementById('dailyGameCards');
            dailyGames.forEach(g => {
                const d = document.createElement('div'); d.className = 'balance-card'; d.innerText = g; container.appendChild(d);
            });
        }
        renderBalance();
    </script>
</body>

</html>
